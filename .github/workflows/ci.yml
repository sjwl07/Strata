name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Compile, format check, unit + integration tests. GitHub runners have Docker, so the
      # Testcontainers Kafka tests run here (they skip on machines without Docker).
      - name: Build and test
        run: ./gradlew build
      # Longer randomized correctness run (~4 min): FULL merge mode must show zero anomalies.
      - name: Correctness checker (40 histories x 3 modes)
        run: ./gradlew :checker:test -Pchecker.histories=40 --rerun
      - name: Quickstart demo
        run: ./gradlew :bench:installDist && bench/build/install/bench/bin/bench demo
